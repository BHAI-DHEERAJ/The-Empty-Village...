<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b110f" />
    <meta name="description" content="Game site menu — The Empty Village Horror and streed3d." />
    <title>Go to Game Site</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b110f;
        --ink: #f6efe4;
        --muted: #a8b3a6;
        --gold: #e6c98f;
        --cyan: #7fd7e8;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(20px, 5vw, 56px);
        background:
          radial-gradient(ellipse at 78% 18%, #263b31 0%, transparent 55%),
          radial-gradient(ellipse at 12% 88%, #12262a 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 35%, #05090799 100%);
      }

      .menu {
        position: relative;
        width: min(100%, 620px);
        padding: clamp(24px, 5vw, 46px);
        border: 1px solid #ffffff1a;
        border-radius: 24px;
        background: #111a17e6;
        box-shadow: 0 28px 80px #020504b3, inset 0 1px #ffffff0f;
        backdrop-filter: blur(8px);
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
        color: var(--gold);
        font: 600 11px/1.4 ui-monospace, SFMono-Regular, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .kicker::before {
        content: "";
        width: 26px;
        height: 1px;
        background: currentColor;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 58px);
        line-height: 1.08;
        letter-spacing: -0.035em;
      }

      .subtitle {
        margin: 12px 0 clamp(28px, 5vw, 40px);
        color: var(--muted);
        font-size: clamp(14px, 2.5vw, 16px);
      }

      .buttons {
        display: grid;
        gap: 14px;
      }

      .btn {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 88px;
        padding: 16px 20px;
        border: 1px solid #ffffff1f;
        border-radius: 16px;
        background: #ffffff08;
        color: var(--ink);
        text-decoration: none;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .btn:hover,
      .btn:focus-visible {
        transform: translateY(-3px);
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        outline: none;
      }

      .btn--village { --accent: var(--gold); }
      .btn--street { --accent: var(--cyan); }

      .icon {
        flex: none;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 13px;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--accent);
      }

      .icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

      .btn-text { display: grid; gap: 3px; min-width: 0; }

      .btn-title { font-size: clamp(16px, 3.5vw, 19px); font-weight: 650; }

      .btn-note { color: var(--muted); font-size: 12px; }

      .arrow {
        margin-left: auto;
        color: var(--accent);
        font-size: 22px;
        transition: transform 0.18s ease;
      }

      .btn:hover .arrow,
      .btn:focus-visible .arrow { transform: translateX(5px); }

      @media (max-width: 420px) {
        .icon { width: 42px; height: 42px; }
        .btn { min-height: 80px; padding: 14px; gap: 12px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn, .arrow { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="menu">
      <p class="kicker">Bhai Dheeraj</p>
      <h1>Go to Game Site</h1>
      <p class="subtitle">Pick a world to open.</p>

      <nav class="buttons" aria-label="Game links">
        <a class="btn btn--village" href="https://github.com/BHAI-DHEERAJ/the-empty-village-horror" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
          </span>
          <span class="btn-text">
            <span class="btn-title">The Empty Village Horror</span>
            <span class="btn-note">GitHub repo page</span>
          </span>
          <span class="arrow" aria-hidden="true">&#8599;</span>
        </a>

        <a class="btn btn--street" href="https://bhai-dheeraj.github.io/streed3d/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 4 5.6 4 9s-1.4 6.5-4 9c-2.6-2.5-4-5.6-4-9s1.4-6.5 4-9Z"/></svg>
          </span>
          <span class="btn-text">
            <span class="btn-title">streed3d</span>
            <span class="btn-note">Real World 3D &mdash; live site</span>
          </span>
          <span class="arrow" aria-hidden="true">&#8599;</span>
        </a>
      </nav>
    </main>
  </body>
</html>
